apiVersion: batch/v1
kind: Job
metadata:
  name: presync-check
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
      - name: check
        image: busybox
        command: ['sh', '-c', 'echo "Pre-flight check passed!" && sleep 2']
      restartPolicy: Never
  backoffLimit: 1
