apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      containers:
      - name: migration
        image: busybox
        command: ['sh', '-c', 'echo "Running DB migrations..." && sleep 5 && echo "Migrations complete!"']
      restartPolicy: Never
  backoffLimit: 2
