apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx-envs
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
          - env: staging
          - env: prod
  template:
    metadata:
      name: 'nginx-{{env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/AbhinavOp-git/argocd-lab
        targetRevision: HEAD
        path: app1
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
